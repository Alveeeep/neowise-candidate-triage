<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");
    const topicLabels = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Цены"],
      ["other", "Другое"],
    ]);
    const invalidInput = "Введите текст заявки.";
    const manualReview = "Не удалось подготовить черновик. Разберите заявку вручную.";
    let latestRequest = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++latestRequest;
      const text = message.value.trim();
      if (!text) {
        result.textContent = invalidInput;
        message.focus();
        return;
      }

      result.textContent = "Разбираем заявку…";
      let output = manualReview;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(5_000),
        });
        const data = await reply.json();
        const topic = topicLabels.get(data?.topic);
        if (reply.ok && data?.status === "ready" && topic && typeof data.draft === "string" && data.draft.trim()) {
          output = `Тема: ${topic}\n\nЧерновик ответа\n${data.draft}`;
        } else if (reply.status === 400 && data?.status === "invalid_input") {
          output = invalidInput;
        }
      } catch {
        // Network and response parsing failures use the same manual flow.
      }
      if (requestId === latestRequest) result.textContent = output;
    });
  </script>
</body>
</html>
